<g><text x="69" y="917" font-size="9.5" fill="#1f2933" font-weight="400" text-anchor="start" xml:space="preserve">Umbral 85: por debajo, el evento queda INCIERTO y nunca autoriza. Sólo se revisan eventos INCIERTO o DENEGADO,</text>
<text x="69" y="930" font-size="9.5" fill="#1f2933" font-weight="400" text-anchor="start" xml:space="preserve">una sola vez y con motivo de al menos 10 caracteres.</text></g>
