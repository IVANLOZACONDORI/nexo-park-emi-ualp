<g><text x="679" y="917" font-size="9.5" fill="#1f2933" font-weight="400" text-anchor="start" xml:space="preserve">El propietario consulta /api/estudiante/mis-accesos y solo ve los movimientos de sus vehículos; el historial</text>
<text x="679" y="930" font-size="9.5" fill="#1f2933" font-weight="400" text-anchor="start" xml:space="preserve">institucional exige historial.ver.</text></g>
