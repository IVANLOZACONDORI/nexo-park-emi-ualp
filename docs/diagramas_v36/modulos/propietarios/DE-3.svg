<circle cx="120" cy="330" r="14" fill="#000000" stroke="#000000" stroke-width="1.4"/>
<rect x="285" y="293" width="210" height="74" fill="#FFFFCC" stroke="#000000" stroke-width="1.5" rx="12" ry="12"/>
<g><text x="390" y="330" font-size="10.5" fill="#000000" font-weight="600" text-anchor="middle" xml:space="preserve">ACTIVO</text></g>
