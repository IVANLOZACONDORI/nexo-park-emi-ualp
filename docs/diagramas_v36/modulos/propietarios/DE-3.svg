<rect x="620" y="293" width="220" height="74" fill="#FFFFCC" stroke="#000000" stroke-width="1.5" rx="12" ry="12"/>
<g><text x="730" y="330" font-size="10.5" fill="#000000" font-weight="600" text-anchor="middle" xml:space="preserve">DESHABILITADO</text></g>
<g><text x="730" y="358" font-size="8.5" fill="#607288" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">sesiones revocadas</text></g>
<g><text x="490" y="589" font-size="9.5" fill="#333333" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">DESHABILITADO conserva el</text>
<text x="490" y="601" font-size="9.5" fill="#333333" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">historial y revoca las</text>
<text x="490" y="613" font-size="9.5" fill="#333333" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">sesiones; el sistema no</text>
<text x="490" y="625" font-size="9.5" fill="#333333" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">elimina físicamente al</text>
<text x="490" y="637" font-size="9.5" fill="#333333" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">propietario. El tipo y la zona</text>
<text x="490" y="650" font-size="9.5" fill="#333333" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">se actualizan sin cambiar el</text>
<text x="490" y="662" font-size="9.5" fill="#333333" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">ciclo de vida.</text></g>
